name: Encrypt and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Encrypt post into the page
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          PAGE_CODE: ${{ secrets.PAGE_CODE }}
          POST_HTML_GZ: ${{ secrets.POST_HTML_GZ }}
          GEMINI_PNG: ${{ secrets.GEMINI_PNG }}
        run: python3 .github/encrypt.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
